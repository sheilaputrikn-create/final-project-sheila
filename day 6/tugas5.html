<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>menampilkan angka dengan for loop</h1>
    <ul id="list-angka"></ul>

    <script>
        let list = document.getElementById("list-angka"); // "L yang ada di bawah

        // mengubah for loop untuk menambahkan angka ke dalam elemen HTML
        for (let i =1000; i >= 2; i-- ) {
            let item = document.createElement("li");
            item.textContent = "angka ke-" + i;

            list.appendChild(item);
        }
    </script>
</body>
</html>
